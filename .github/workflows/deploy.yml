name: Deploy to Production

on:
  push:
    branches: [deploy]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy production stack
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy

      - name: Deploy
        run: bash scripts/deploy-production.sh
        env:
          ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
